name: Cask checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew with this tap
        uses: Homebrew/actions/setup-homebrew@main

      # Homebrew 6+ refuses to load casks from an untrusted third-party tap.
      - name: Trust this tap
        run: brew trust unstoppableweb/tap

      - name: Check style
        run: brew style unstoppableweb/tap

      - name: Audit casks
        run: |
          shopt -s nullglob
          for cask in "$(brew --repository unstoppableweb/tap)"/Casks/*.rb; do
            brew audit --cask --strict --online "unstoppableweb/tap/$(basename "$cask" .rb)"
          done
